<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Thesis Repository Management System</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-box-header">
      <span class="logo">🎓</span>
      <h1>Thesis Repository Management System</h1>
      <p>Digital Thesis Archive & Version Control</p>
    </div>

    <div class="auth-box-body">
      <h2 style="text-align:center;color:var(--blue);font-size:1rem;font-weight:700;margin-bottom:1.3rem">
        Sign In to Your Account
      </h2>

      <div id="login-alert" class="alert hidden"></div>


      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">📧 Email Address</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@un.ac.ke" autocomplete="email"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">🔒 Password</label>
          <div class="pwd-wrap">
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Enter your password" autocomplete="current-password"/>
            <button type="button" class="pwd-toggle" id="toggle-pwd">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-blue btn-block" style="margin-top:.75rem">
          ➜&nbsp; Login
        </button>

      </form>

      <div class="divider">or</div>

      <p style="text-align:center;font-size:.85rem;color:var(--muted)">
        Don't have an account?
        <a href="signup.html" style="color:var(--blue);font-weight:600">Create Account</a>
      </p>
    </div>

    <div class="auth-box-footer">
      🔒 Secured with SHA-256 Content-Addressable Storage
    </div>

  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
